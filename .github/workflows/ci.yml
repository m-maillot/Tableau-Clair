name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tableau
          POSTGRES_PASSWORD: tableau
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tableau"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Les tests d'intégration créent leurs propres bases jetables.
      TEST_DATABASE_URL: postgres://tableau:tableau@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: MinIO (stockage S3 des tests d'intégration)
        run: |
          docker run -d --name minio -p 9010:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9010/minio/health/ready && exit 0
            sleep 1
          done
          echo "MinIO n'a pas démarré" && exit 1
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

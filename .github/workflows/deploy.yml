name: Deploy

# Déploie sur le VPS quand la CI est verte sur main (ou à la main depuis l'onglet Actions).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_DIR: /opt/tableau-clair
    steps:
      # ghcr.io exige un nom d'image en minuscules (le dépôt contient une majuscule).
      - name: Nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clé SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Envoi des fichiers de déploiement
        run: |
          scp docker-compose.prod.yml Caddyfile \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${DEPLOY_DIR}/"

      - name: Déploiement
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "REGISTRY_TOKEN='$REGISTRY_TOKEN' REGISTRY_USER='$REGISTRY_USER' APP_IMAGE='${IMAGE}:${SHA}' bash -s" <<'EOF'
          set -euo pipefail
          cd /opt/tableau-clair
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          export APP_IMAGE
          docker compose -f docker-compose.prod.yml --env-file .env pull app
          docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
          # Un Caddyfile modifié ne recrée pas le conteneur : on recharge la config à chaud.
          # Sans effet (ignoré) si Caddy vient d'être créé : il lit alors déjà le nouveau fichier.
          docker compose -f docker-compose.prod.yml exec -T caddy \
            caddy reload --config /etc/caddy/Caddyfile || true
          docker logout ghcr.io
          docker image prune -f
          # Attend que l'application soit saine (les migrations tournent au démarrage).
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose -f docker-compose.prod.yml ps -q app)")
            [ "$status" = healthy ] && echo "Application saine" && exit 0
            sleep 2
          done
          echo "L'application n'est pas devenue saine" >&2
          docker compose -f docker-compose.prod.yml logs --tail 50 app >&2
          exit 1
          EOF

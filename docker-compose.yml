# Environnement de développement : services d'infrastructure uniquement.
# L'API et le web tournent sur la machine (`pnpm dev`).
name: tableau-clair-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tableau}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tableau}
      POSTGRES_DB: ${POSTGRES_DB:-tableau_clair}
    ports:
      - '${POSTGRES_PORT:-6010}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '${S3_PORT:-6020}:9000'
      - '${S3_CONSOLE_PORT:-6021}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Crée le bucket privé au démarrage, puis s'arrête.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set none local/$${S3_BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-tableau-clair}
    restart: 'no'

  # Capture les e-mails sortants (liens magiques) : interface sur http://localhost:6031
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${SMTP_PORT:-6030}:1025'
      - '${MAILPIT_UI_PORT:-6031}:8025'

volumes:
  postgres-data:
  minio-data:

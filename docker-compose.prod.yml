# Production : app (API + front), postgres, reverse proxy HTTPS.
# Le stockage objet est un S3 externe (variables S3_*), pas de MinIO.
# Usage : docker compose -f docker-compose.prod.yml --env-file .env up -d --build
name: tableau-clair

services:
  app:
    # APP_IMAGE est fourni par le workflow de déploiement (image du registre) ;
    # sans lui, l'image est construite localement.
    image: ${APP_IMAGE:-tableau-clair:local}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    # Pas de port publié : seul le reverse proxy y accède.
    expose:
      - '6001'

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
